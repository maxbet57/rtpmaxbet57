            { id: 95, name: "Medusa II", provider: "pgsoft", img: "https://www.pgsoft.com/uploads/Games/Images/8f0ba72e-1a49-48c3-9158-a9ec59933bc8.jpg" },
            { id: 96, name: "Hood vs Wolf", provider: "pgsoft", img: "https://www.pgsoft.com/uploads/Games/Images/b19c05b6-1243-4ca8-913d-4d4979272174.jpg" },
            { id: 97, name: "Dragon Legend", provider: "pgsoft", img: "https://www.pgsoft.com/uploads/Games/Images/cbcbeca9-80cb-408c-b5ac-6685bcef33ff.jpg" },
            { id: 98, name: "Wild Fireworks", provider: "pgsoft", img: "https://www.pgsoft.com/uploads/Games/Images/bb2db6b3-c386-40a4-9fc8-a988aeac68c2.jpg" },
            { id: 99, name: "Genie's 3 Wishes", provider: "pgsoft", img: "https://www.pgsoft.com/uploads/Games/Images/57d40efb-9c97-4c1b-977c-921a5f6173b8.jpg" },
            { id: 100, name: "Galactic Gems", provider: "pgsoft", img: "https://www.pgsoft.com/uploads/Games/Images/71e29ba0-e61f-4c44-be7d-915fe6469b3d.jpg" }
        ];

        // Generate Random RTP & Pola Detail secara Dinamis
        function generateGameDetails(game) {
            const rtp = Math.floor(Math.random() * (98 - 65 + 1)) + 65;
            
            const startHour = String(Math.floor(Math.random() * 20)).padStart(2, '0');
            const endHour = String(Number(startHour) + Math.floor(Math.random() * 3) + 1).padStart(2, '0');
            const jamGacor = `${startHour}:00 - ${endHour}:00 WIB`;

            const dcStatus = Math.random() > 0.5 ? 'ON' : 'OFF';

            const polaOptions = [
                ["10x Manual Spin", "20x Auto Spin (Turbo ON)", "30x Auto Spin (Quick OFF)"],
                ["30x Auto Spin (Turbo ON)", "10x Manual Spin", "50x Auto Spin (Quick ON)"],
                ["50x Auto Spin (Quick ON)", "20x Auto Spin (Turbo ON)", "10x Manual Spin"],
                ["15x Manual Spin", "30x Auto Spin (Turbo OFF)", "20x Auto Spin (Quick ON)"]
            ];
            const polaSteps = polaOptions[Math.floor(Math.random() * polaOptions.length)];

            return { rtp, jamGacor, dcStatus, polaSteps };
        }

        // Render Game Grid
        let currentFilter = 'all';

        function renderGames() {
            const grid = document.getElementById('gameGrid');
            grid.innerHTML = '';

            gamesData.forEach(game => {
                if (currentFilter !== 'all' && game.provider !== currentFilter) return;

                const details = generateGameDetails(game);
                
                let bgClass = 'bg-low';
                if (details.rtp >= 85) bgClass = 'bg-high';
                else if (details.rtp >= 75) bgClass = 'bg-medium';

                const card = document.createElement('div');
                card.className = 'game-card';
                card.setAttribute('data-name', game.name.toLowerCase());
                card.innerHTML = `
                    <div class="game-img-container">
                        <img src="${game.img}" alt="${game.name}" class="game-img" onerror="this.src='https://via.placeholder.com/150?text=Slot+Gacor'">
                    </div>
                    <div class="game-title">${game.name}</div>
                    <div class="rtp-container">
                        <div class="rtp-bar-bg">
                            <div class="rtp-bar-fill ${bgClass}" style="width: ${details.rtp}%;"></div>
                            <div class="rtp-text">RTP ${details.rtp}%</div>
                        </div>
                    </div>
                    <button class="btn-pola" onclick="openPolaModal('${game.name}', '${game.provider.toUpperCase()}', ${details.rtp}, '${details.jamGacor}', '${details.dcStatus}', '${details.polaSteps.join('|')}')">
                        <i class="fa-solid fa-fire"></i> POLA MAIN
                    </button>
                `;
                grid.appendChild(card);
            });
        }

        // Filter Provider
        function filterGames(provider, btn) {
            currentFilter = provider;
            document.querySelectorAll('.btn-provider').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderGames();
        }

        // Search Game
        function searchGame() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.game-card');
            
            cards.forEach(card => {
                const name = card.getAttribute('data-name');
                if (name.includes(input)) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        // Modal Functionality
        function openPolaModal(name, provider, rtp, jamGacor, dc, polaStr) {
            document.getElementById('modalGameTitle').innerText = name;
            document.getElementById('modalProvider').innerText = provider;
            
            const fill = document.getElementById('modalRtpFill');
            const text = document.getElementById('modalRtpText');
            
            fill.className = 'rtp-bar-fill ' + (rtp >= 85 ? 'bg-high' : rtp >= 75 ? 'bg-medium' : 'bg-low');
            fill.style.width = rtp + '%';
            text.innerText = 'RTP ' + rtp + '%';

            document.getElementById('modalJamGacor').innerText = jamGacor;
            
            const dcElem = document.getElementById('modalDc');
            if (dc === 'ON') {
                dcElem.innerHTML = '<span class="badge-on">ON</span>';
            } else {
                dcElem.innerHTML = '<span class="badge-off">OFF</span>';
            }

            const polaList = document.getElementById('modalPolaList');
            polaList.innerHTML = '';
            const steps = polaStr.split('|');
            steps.forEach(step => {
                const li = document.createElement('li');
                li.innerText = step;
                polaList.appendChild(li);
            });

            document.getElementById('polaModal').classList.add('active');
        }

        function closePolaModal() {
            document.getElementById('polaModal').classList.remove('active');
        }

        // Inisialisasi awal saat halaman dimuat
        document.addEventListener('DOMContentLoaded', renderGames);
   </script>
</body>
